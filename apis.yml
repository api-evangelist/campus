aid: campus
name: Campus
description: >-
  Campus (campus.edu) is an accredited, for-profit online community college
  offering associate degree programs built on the CUNY ASAP high-touch support
  model, with live classes taught by faculty from top universities, personal
  success coaching, and tuition capped at the Pell Grant maximum. Founded by
  Tade Oyerinde and backed by Founders Fund, General Catalyst, Bloomberg Beta,
  8VC, Rethink Education and others, Campus focuses on affordable, accessible
  higher education and career preparation across programs such as applied AI,
  business, information technology and healthcare administration. This profile
  was surfaced as a venture portfolio lead and enriched from the company's
  public web surface; Campus is a consumer education provider and publishes no
  public developer API at this time.
